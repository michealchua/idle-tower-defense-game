<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combat Renderer Test</title>
    <style>
      body {
        margin: 0;
        background: #0b0b0b;
        color: #eee;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 0;
      }
      #game-container {
        position: relative;
        width: 960px;
      }
      #game-canvas {
        display: block;
        width: 960px;
        height: 540px;
        background: #000;
        border: 2px solid #333;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 8px 14px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.7;
        pointer-events: none;
      }
      #hud-message {
        min-height: 1.4em;
        color: #ffd54f;
        font-weight: bold;
      }
      #build-panel {
        width: 960px;
        margin-top: 14px;
        display: flex;
        gap: 10px;
      }
      #build-panel button {
        padding: 8px 16px;
        font-size: 14px;
        background: #262626;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        cursor: pointer;
      }
      #build-panel button:hover:not(:disabled) {
        background: #333;
      }
      #build-panel button.active {
        border-color: #ffd54f;
        box-shadow: 0 0 0 1px #ffd54f;
      }
      #build-panel button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #hero-panel {
        display: none;
        position: absolute;
        top: 12px;
        right: 12px;
        width: 220px;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid #facc15;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.6;
      }
      #hero-panel .hero-panel-title {
        font-weight: bold;
        color: #facc15;
        margin-bottom: 4px;
      }
      #hero-panel .hero-panel-stats {
        margin-bottom: 8px;
      }
      #hero-panel button {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 6px 10px;
        font-size: 12px;
        background: #262626;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        cursor: pointer;
      }
      #hero-panel button:hover:not(:disabled) {
        background: #333;
      }
      #hero-panel button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas" width="960" height="540"></canvas>
      <div id="hud">
        <div>金币: <span id="hud-gold">0</span></div>
        <div>经验: <span id="hud-exp">0</span></div>
        <div>波次: <span id="hud-wave">-</span></div>
      </div>
      <div id="hero-panel"></div>
    </div>
    <div id="build-panel"></div>
    <div id="hud-message"></div>
    <script type="module" src="/src/combat/main.ts"></script>
  </body>
</html>
