name: Build and release desktop app

# Every push to main packages a fresh Windows installer and publishes it as
# a GitHub Release. electron-updater (wired up in electron/main.cjs) makes
# every already-installed copy of the app check this repo's Releases on
# startup and auto-update itself - so a push here is what "the app updates
# itself" actually means end to end. See electron/README.md for the full
# picture of how the pieces fit together.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install electron shell dependencies
        run: npm ci
        working-directory: electron

      - name: Set release version
        # electron-updater compares semver, so every push needs a strictly
        # higher version than the last release for auto-update to trigger.
        # The GitHub Actions run number always increases, so 1.0.<run_number>
        # is a simple monotonic version without needing to commit version
        # bumps back to the repo (which would also just re-trigger this
        # workflow). Both package.json files are set: the root one is only
        # build metadata, but electron/package.json's version is what
        # app.getVersion()/electron-updater actually compare against, since
        # build.directories.app points at electron/.
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          npm pkg set version="$VERSION"
          npm pkg set version="$VERSION" --prefix electron
          echo "Releasing version $VERSION"

      - name: Build web app
        run: npm run build

      - name: Package and publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
