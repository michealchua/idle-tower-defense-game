name: Build and release desktop app

# Every push to main packages a fresh Windows installer and publishes it as
# a GitHub Release. electron-updater (wired up in electron/main.cjs) makes
# every already-installed copy of the app check this repo's Releases on
# startup and auto-update itself - so a push here is what "the app updates
# itself" actually means end to end. See electron/README.md for the full
# picture of how the pieces fit together.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install electron shell dependencies
        run: npm ci
        working-directory: electron

      - name: Set release version
        # electron-updater compares semver, so every push needs a strictly
        # higher version than the last release for auto-update to trigger.
        # The GitHub Actions run number always increases, so 1.0.<run_number>
        # is a simple monotonic version without needing to commit version
        # bumps back to the repo (which would also just re-trigger this
        # workflow). Both package.json files are set: the root one is only
        # build metadata, but electron/package.json's version is what
        # app.getVersion()/electron-updater actually compare against, since
        # build.directories.app points at electron/. Exported to
        # GITHUB_ENV so the tag-push step below (and anything else that
        # needs it) doesn't recompute it separately.
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          npm pkg set version="$VERSION"
          npm pkg set version="$VERSION" --prefix electron
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION"

      # package.json's publish.releaseType is "release" (published
      # immediately, not draft) - GitHub's API rejects creating an
      # already-published release whose tag doesn't exist yet ("Published
      # releases must have a valid tag", a 422), and nothing else in this
      # workflow ever created that tag. A draft release can reference a
      # not-yet-existing tag (GitHub creates it on publish), but going
      # straight to draft:false cannot - so the tag has to exist first.
      - name: Push release tag
        shell: bash
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # electron-builder uploads the .blockmap and the .exe as two separate
      # publish tasks; each one independently asks "does a release for this
      # tag exist yet?" and, seeing no release object created yet, creates
      # one - the two checks race, and both can lose, leaving two separate
      # Release objects for the same tag (one holding only the blockmap, the
      # other holding the real installer). Pre-creating the release here
      # means electron-builder always finds one already there and just
      # uploads assets to it, instead of racing to create it twice.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" --title "$VERSION" --generate-notes

      - name: Build web app
        run: npm run build

      - name: Package and publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Safety net on top of the pre-create above, and cleans up the
      # existing v1.0.13/14/15 orphans from before this fix - sweeps every
      # published (non-draft) release and removes any that ended up without
      # an .exe asset, which only ever happens to the losing side of the
      # race described above.
      - name: Clean up incomplete duplicate releases
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate --jq \
            '.[] | select(.draft == false) | select([.assets[].name] | any(endswith(".exe")) | not) | .id' |
          while read -r id; do
            echo "Deleting incomplete release id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
